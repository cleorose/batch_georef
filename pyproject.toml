[project]
name = "batch-georef"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { email = "cleorose@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fiona>=1.10.1",
    "geopandas>=1.2.0",
    "ipywidgets>=8.1.9",
    "pillow>=13.0.0",
    "pyproj>=3.8.0",
    "pyyaml>=6.0.3",
    "rasterio>=1.5.2",
    "requests>=2.34.2",
    "shapely>=2.1.2",
    "tqdm>=4.70.1",
]

[tool.uv]
package = false

[project.scripts]
batch-georef = "batch_georef:main"

[build-system]
requires = ["uv_build>=0.12.21,<0.13.0"]
build-backend = "uv_build"
